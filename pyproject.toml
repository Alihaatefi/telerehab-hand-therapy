[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telerehab-hand-therapy"
version = "2.0.0"
description = "Vision-based hand rehabilitation exercises with clinician reporting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Ali Hatefi", email = "a.hatefi.research@gmail.com" }]
keywords = ["telerehabilitation", "computer-vision", "mediapipe", "biofeedback", "pyside6"]
classifiers = [
    # Proprietary, evaluation-only: see LICENSE. "Do Not Upload" makes PyPI refuse
    # an accidental upload of a package that must not be redistributed.
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # MediaPipe removed the `mp.solutions` API this project uses in releases
    # after 0.10.14, and 0.10.14 is the last release with CPython 3.12 wheels.
    # All MediaPipe access is confined to telerehab/vision/hand_tracker.py, so
    # migrating to the newer Tasks API is a single-file change.
    "mediapipe==0.10.14",
    "PySide6>=6.7",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
telerehab = "telerehab.__main__:main"

[project.urls]
Repository = "https://github.com/Alihaatefi/telerehab-hand-therapy"

[tool.setuptools.packages.find]
where = ["src"]

# The reference photographs and the chime ship inside the package.
[tool.setuptools.package-data]
telerehab = ["resources/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "vision: exercises the real MediaPipe pipeline (slow, needs the model)",
    "ui: builds real Qt widgets (runs offscreen, needs no display)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # line length is advisory; long docstrings and tables are fine
    "RUF012",  # mutable class attributes on Qt subclasses are intentional
    "RUF001", "RUF002", "RUF003",  # typographic dashes in prose are intentional
    "UP035",   # typing.Callable/Sequence are fine on the supported Pythons
    "C408",    # dict(key=value) reads better than a literal for keyword-style data
]

[tool.ruff.lint.isort]
known-first-party = ["telerehab"]

[tool.mypy]
python_version = "3.10"
files = ["src/telerehab"]
ignore_missing_imports = true
warn_unused_ignores = true
# The logic layers are fully typed; the Qt layer is checked more loosely.

[[tool.mypy.overrides]]
module = ["telerehab.games.*", "telerehab.api.*", "telerehab.vision.calibration", "telerehab.vision.geometry", "telerehab.reports.*", "telerehab.config"]
disallow_untyped_defs = true
